<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#0A1A2F;color:#FAF9F6;font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}

  @keyframes dd-fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
  .wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px;padding:clamp(48px,10vw,96px) clamp(20px,5vw,40px);max-width:640px;margin:0 auto;animation:dd-fadeup .5s cubic-bezier(.22,1,.36,1) both}
  .code{font-family:'Fraunces',serif;font-size:13px;letter-spacing:0.18em;text-transform:uppercase;color:#5A6E86}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:clamp(2rem,6vw,3rem);line-height:1.1;letter-spacing:-0.025em;margin:0;text-wrap:balance}

  .row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:6px}
  .btn{background:#0F8B80;color:#FAF9F6;border-radius:10px;padding:16px 32px;font-size:16px;font-weight:600;box-shadow:0 10px 28px rgba(0,0,0,0.3);transition:background-color .25s,transform .3s cubic-bezier(.22,1,.36,1)}
  .btn:hover{background:#0B6E66;color:#FAF9F6;transform:translateY(-2px)}
  .ghost{border:1px solid rgba(250,249,246,0.28);border-radius:10px;padding:16px 28px;font-size:16px;font-weight:600;color:#B9C4D4;transition:border-color .25s,color .25s,transform .3s cubic-bezier(.22,1,.36,1)}
  .ghost:hover{border-color:#0F8B80;color:#FAF9F6;transform:translateY(-2px)}
  img.toothy{width:110px;height:110px;image-rendering:pixelated;object-fit:contain;animation:toothy-bob 2.6s ease-in-out infinite}
  footer{border-top:1px solid #22344E;padding:22px clamp(20px,5vw,40px);display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;font-size:12.5px;color:#3D4F66}
  footer a{color:#5A6E86}
  footer a:hover{color:#8A9BB5}

<body>

  </footer>
  <script>
    // Log the miss so broken links show up in the admin dashboard rather than silently rotting.
    //
    // It reuses the same visitor and session ids the main page issues, so a dead link appears
    // inside that visitor's journey instead of floating free. It only ever READS the ids: a
    // visitor whose first ever hit is a 404 should not be minted an identity by an error page.
    try {
      var vid = null, sid = null;
      try { vid = localStorage.getItem('dd_vid'); } catch (e) {}
      try { sid = sessionStorage.getItem('dd_sid'); } catch (e) {}
      var p = new URLSearchParams(location.search);
      var body = JSON.stringify({
        event: 'page_not_found',
        props: { path: location.pathname },
        vid: vid, sid: sid,
        utm: { source: p.get('utm_source'), medium: p.get('utm_medium'), campaign: p.get('utm_campaign') },
        path: location.pathname, ref: document.referrer || '', ts: Date.now()
      });
      if (navigator.sendBeacon) navigator.sendBeacon('/api/event', new Blob([body], { type: 'application/json' }));
      else fetch('/api/event', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true }).catch(function () {});
    } catch (e) {}
  </script>
</body>
